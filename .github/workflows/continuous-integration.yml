name: 'Continuous Integration'

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only: pull requests (forks included) must never reach
# the privileged self-hosted runners this repo provisions.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 'Run shellcheck'
        shell: bash
        run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: bats-core/bats-action@4.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 'Run bats tests'
        shell: bash
        run: make test

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 'Validate docker-compose.yml'
        shell: bash
        run: make config
